version: 2
updates:
  # Keep our GitHub Actions pinned to up-to-date versions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Stack-specific ecosystems get added here once a project picks its language.
  # Examples:
  #
  # - package-ecosystem: "npm"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  #
  # - package-ecosystem: "pip"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
  #
  # - package-ecosystem: "cargo"
  #   directory: "/"
  #   schedule: { interval: "weekly" }
